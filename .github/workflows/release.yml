name: Release

# Durable publish on debian/<full-version> tag push. See "Releasing"
# in debian/source/README.source for the paired-tag procedure.

on:
  push:
    tags: ['debian/**']

permissions:
  contents: read

jobs:
  preflight:
    name: Verify paired source tag
    runs-on: ubuntu-24.04-arm
    outputs:
      packaging-version: ${{ steps.parse.outputs.packaging }}
      upstream-version: ${{ steps.parse.outputs.upstream }}
      upstream-ref: ${{ steps.parse.outputs.ref }}
      libcamera-pin: ${{ steps.pin.outputs.libcamera }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Parse packaging tag
        id: parse
        run: |
          set -euo pipefail
          PACKAGING="${GITHUB_REF#refs/tags/debian/}"
          UPSTREAM="${PACKAGING%-*}"
          UPSTREAM_REF="v${UPSTREAM}"
          echo "packaging=${PACKAGING}" >> "$GITHUB_OUTPUT"
          echo "upstream=${UPSTREAM}"   >> "$GITHUB_OUTPUT"
          echo "ref=${UPSTREAM_REF}"    >> "$GITHUB_OUTPUT"
          echo "Packaging tag : debian/${PACKAGING}"
          echo "Upstream ref  : ${UPSTREAM_REF}"

      - name: Read pinned libcamera version
        id: pin
        run: |
          set -euo pipefail
          PIN=$(tr -d '[:space:]' < debian/libcamera.pin)
          [ -n "$PIN" ] || { echo "::error::empty debian/libcamera.pin"; exit 1; }
          echo "libcamera=${PIN}" >> "$GITHUB_OUTPUT"
          echo "Pinned libcamera: ${PIN}"

      - name: Verify source tag exists (fail fast)
        run: |
          set -euo pipefail
          REF="${{ steps.parse.outputs.ref }}"
          if ! git rev-parse "refs/tags/${REF}" >/dev/null 2>&1; then
            echo "::error::Source tag '${REF}' does not exist on this repo."
            echo "::error::Tag the source on the kurokesu branch with this name (revision-less),"
            echo "::error::push it, then re-push the packaging tag to trigger this workflow."
            exit 1
          fi
          echo "OK: source tag ${REF} -> $(git rev-parse "refs/tags/${REF}")"

      - name: Verify tag matches debian/changelog
        # Guards hand-made tags (release.sh tags always match). The
        # checkout on a tag push is the tagged commit.
        run: |
          set -euo pipefail
          command -v dpkg-parsechangelog >/dev/null \
            || sudo apt-get install -y --no-install-recommends dpkg-dev
          CHANGELOG=$(dpkg-parsechangelog -SVersion)
          TAG="${{ steps.parse.outputs.packaging }}"
          if [ "${CHANGELOG}" != "${TAG}" ]; then
            echo "::error::Packaging tag says '${TAG}' but debian/changelog at the tagged commit says '${CHANGELOG}'."
            echo "::error::Use release.sh or retag the commit with a matching changelog."
            exit 1
          fi
          echo "OK: tag matches changelog (${CHANGELOG})"

  build:
    needs: preflight
    name: ${{ matrix.suite }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: trixie
            profiles: nodoc
            version-suffix: ''
          - suite: bookworm
            profiles: pkg.rpicam-apps.nolibav,nodoc
            version-suffix: '~bpo12+1'
    uses: ./.github/workflows/_build.yml
    with:
      suite: ${{ matrix.suite }}
      profiles: ${{ matrix.profiles }}
      source-repo: ${{ github.repository }}
      package-name: rpicam-apps
      upstream-ref: ${{ needs.preflight.outputs.upstream-ref }}
      version-suffix: ${{ matrix.version-suffix }}

  sign:
    needs: [preflight, build]
    name: Bundle and sign
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          sparse-checkout: .github/keys

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts/

      - name: Bundle assets
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p release-assets
          for dir in artifacts/*/; do
            name=$(basename "$dir")
            ( cd "$dir"
              files=( *.deb *.changes *.buildinfo )
              keep=()
              for f in "${files[@]}"; do
                [[ $f == *dbgsym* ]] || keep+=("$f")
              done
              [ "${#keep[@]}" -gt 0 ] \
                || { echo "::error::Nothing to bundle for ${name}."; exit 1; }
              tar -czf "${GITHUB_WORKSPACE}/release-assets/${name}.tar.gz" \
                -- "${keep[@]}"
            )
          done
          cd release-assets
          # Guard the glob: unmatched would make sha256sum read stdin.
          tarballs=( *.tar.gz )
          [ "${#tarballs[@]}" -gt 0 ] \
            || { echo "::error::No tarballs produced."; exit 1; }
          sha256sum -- "${tarballs[@]}" > SHA256SUMS
          ls -la

      - name: Sign SHA256SUMS
        env:
          ARCHIVE_GPG_SIGNING_KEY: ${{ secrets.ARCHIVE_GPG_SIGNING_KEY }}
        run: |
          set -euo pipefail
          GNUPGHOME=$(mktemp -d); export GNUPGHOME
          trap 'gpgconf --kill all 2>/dev/null || true; rm -rf "$GNUPGHOME"' EXIT

          # || true: an empty/garbage secret falls through to the
          # actionable assertion below instead of a bare gpg error.
          printf '%s' "$ARCHIVE_GPG_SIGNING_KEY" \
            | gpg --batch --quiet --no-greeting --import || true

          # || KEYIDS="" keeps the error below reachable under pipefail
          # when the import yielded no secret keys.
          KEYIDS=$(gpg --list-secret-keys --with-colons 2>/dev/null \
            | awk -F: '$1=="ssb" && $12~/s/ {print $5}') || KEYIDS=""
          [ -n "$KEYIDS" ] && [ "$(printf '%s\n' "$KEYIDS" | wc -l)" -eq 1 ] \
            || { echo "::error::Expected exactly one signing subkey; found: ${KEYIDS:-none}."; exit 1; }

          cd release-assets
          gpg --batch --yes --quiet --pinentry-mode loopback \
            --no-auto-key-locate --keyserver-options no-auto-key-retrieve \
            --local-user "$KEYIDS" \
            --detach-sign --armor SHA256SUMS

          # Independent check that the published keyring validates the signature.
          gpgv --keyring "${GITHUB_WORKSPACE}/.github/keys/kurokesu-archive-keyring.gpg" \
            SHA256SUMS.asc SHA256SUMS

      - name: Upload signed release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: release-assets/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [preflight, sign]
    name: Publish GitHub Release
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release-assets/

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ needs.preflight.outputs.upstream-ref }}"
          PKG_REV="${{ needs.preflight.outputs.packaging-version }}"
          UPSTREAM="${{ needs.preflight.outputs.upstream-version }}"
          LIBCAMERA_PIN="${{ needs.preflight.outputs.libcamera-pin }}"
          RPI_TAG="v${UPSTREAM%+krks*}"
          RPI_URL="https://github.com/raspberrypi/rpicam-apps/releases/tag/${RPI_TAG//+/%2B}"

          # Re-run on the same tag only refreshes assets, leaving
          # the title, Pre-release flag and any manual notes intact.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" \
              --clobber release-assets/*
            exit 0
          fi

          # Skeleton notes for manual fill-in before promoting
          # from Pre-release to Latest.
          NOTES=$(cat <<EOF
          Kurokesu's \`raspberrypi/rpicam-apps\` fork
          Raspberry Pi's [${RPI_TAG}](${RPI_URL}) release with Kurokesu's changes integrated on top.

          ### Pinned libcamera version

          Built against Kurokesu's libcamera \`${LIBCAMERA_PIN}\`.

          ### Added on top of the Raspberry Pi base


          ### Hardware validated


          Ships as a drop-in upgrade: stock Raspberry Pi OS package names at a higher version for Bookworm and Trixie (arm64).

          Packaging revision: \`${PKG_REV}\`
          EOF
          )

          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --prerelease \
            --notes "$NOTES" \
            release-assets/*
