name: Build .deb (reusable)

# Builds the .deb set in an unprivileged sbuild chroot with the RPi
# apt archive layered in. Called by ci.yml and release.yml.

on:
  workflow_call:
    inputs:
      suite:
        description: Debian suite to build for (trixie, bookworm)
        type: string
        required: true
      profiles:
        description: Comma-separated dpkg build profiles (DEB_BUILD_PROFILES)
        type: string
        required: true
      source-repo:
        description: owner/repo to fetch the upstream source from
        type: string
        required: true
      package-name:
        description: Source package name (used for orig.tar.xz naming)
        type: string
        required: true
      upstream-ref:
        description: Git ref for the upstream source checkout (branch or tag)
        type: string
        default: kurokesu
      version-suffix:
        description: Suffix appended to the binary version at build time (e.g. ~bpo12+1)
        type: string
        default: ''
      arch:
        description: Debian architecture to build for (arm64, armhf)
        type: string
        default: arm64

jobs:
  build:
    name: sbuild
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: Checkout recipe (debian/)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          path: recipe

      - name: Checkout upstream source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          repository: ${{ inputs.source-repo }}
          ref: ${{ inputs.upstream-ref }}
          path: upstream

      - name: Install build tooling
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            sbuild mmdebstrap uidmap arch-test \
            dpkg-dev devscripts \
            debian-archive-keyring \
            ca-certificates xz-utils zstd

      - name: Use pinned Debian archive keyring
        # Ubuntu's debian-archive-keyring lags Debian's key rotation
        # and cannot verify current InRelease files. The path is also
        # valid inside the chroot, where the suite's own
        # debian-archive-keyring package provides it.
        run: |
          set -euo pipefail
          sudo cp .github/keys/debian-archive-keyring.gpg \
            /usr/share/keyrings/debian-archive-keyring.gpg
        working-directory: recipe

      - name: Configure sbuild for unshare backend
        env:
          LIBCAMERA_PIN_DIR: ${{ github.workspace }}/libcamera-pin
        run: |
          set -euo pipefail
          mkdir -p ~/.cache/sbuild
          # Make the local pin repo visible inside sbuild's unshare namespace.
          cat > ~/.sbuildrc <<EOF
          \$chroot_mode = 'unshare';
          \$unshare_bind_mounts = [ { directory => '${LIBCAMERA_PIN_DIR}', mountpoint => '${LIBCAMERA_PIN_DIR}' } ];
          1;
          EOF

      - name: Create chroot tarball (${{ inputs.suite }}-${{ inputs.arch }})
        # The signed-by path stays valid inside the chroot through
        # its own debian-archive-keyring package.
        run: |
          set -euo pipefail
          mmdebstrap \
            --variant=buildd \
            --architectures=${{ inputs.arch }} \
            --include=ca-certificates,debian-archive-keyring \
            "${{ inputs.suite }}" \
            ~/.cache/sbuild/"${{ inputs.suite }}"-"${{ inputs.arch }}".tar.zst \
            "deb [signed-by=/usr/share/keyrings/debian-archive-keyring.gpg] http://deb.debian.org/debian ${{ inputs.suite }} main"

      - name: Compute upstream + packaging versions from changelog
        id: version
        working-directory: recipe
        run: |
          set -euo pipefail
          PACKAGING=$(dpkg-parsechangelog -SVersion)
          UPSTREAM=${PACKAGING%-*}
          # Upstream version (and orig tarball) stays shared.
          PACKAGING="${PACKAGING}${{ inputs.version-suffix }}"
          # GitHub rewrites ~ to . in release uploads. Use + to
          # keep SHA256SUMS valid.
          PACKAGING_FNAME="${PACKAGING//\~/+}"
          echo "packaging=${PACKAGING}"             >> "$GITHUB_OUTPUT"
          echo "packaging-fname=${PACKAGING_FNAME}" >> "$GITHUB_OUTPUT"
          echo "upstream=${UPSTREAM}"               >> "$GITHUB_OUTPUT"
          echo "Packaging version: ${PACKAGING}"
          echo "Upstream version:  ${UPSTREAM}"

      - name: Pin libcamera from release
        env:
          GH_TOKEN: ${{ github.token }}
          SUITE: ${{ inputs.suite }}
          ARCH: ${{ inputs.arch }}
        run: |
          set -euo pipefail

          PINNED_VERSION=$(tr -d '[:space:]' < recipe/debian/libcamera.pin)
          [ -n "$PINNED_VERSION" ] || { echo "::error::empty libcamera.pin"; exit 1; }
          SOURCE_TAG="v${PINNED_VERSION%-*}"

          mkdir -p libcamera-pin
          cd libcamera-pin

          # Download the per-suite tarball and the signed checksums. The
          # glob covers the optional per-suite suffix (e.g. bookworm's
          # +bpo12+1), so this step needs no knowledge of libcamera's
          # suffix policy.
          PATTERN="libcamera_${PINNED_VERSION}*_${SUITE}_${ARCH}.tar.gz"
          gh release download "$SOURCE_TAG" \
            --repo Kurokesu/libcamera \
            --pattern "$PATTERN" \
            --pattern SHA256SUMS \
            --pattern SHA256SUMS.asc

          # gh downloads whatever matches, so assert exactly one tarball
          # resolved for this suite/arch before trusting it.
          shopt -s nullglob
          MATCHES=( $PATTERN )
          if [ "${#MATCHES[@]}" -ne 1 ]; then
            echo "::error::expected one libcamera tarball for ${SUITE}/${ARCH}, got: ${MATCHES[*]:-none}"
            exit 1
          fi
          ASSET_NAME="${MATCHES[0]}"

          # Throwaway keyring so this does not pollute the host.
          GNUPGHOME=$(mktemp -d)
          export GNUPGHOME
          trap 'rm -rf "$GNUPGHOME"' EXIT
          gpg --batch --quiet --import \
            "${GITHUB_WORKSPACE}/recipe/.github/keys/kurokesu-archive-public.asc"
          gpg --batch --verify SHA256SUMS.asc SHA256SUMS

          sha256sum -c --ignore-missing SHA256SUMS

          tar xf "$ASSET_NAME"
          dpkg-scanpackages --multiversion . > Packages
          gzip -kf Packages

          cat > Release <<EOF
          Origin: Kurokesu-libcamera-pin
          Suite: ${SUITE}
          Components: main
          Architectures: ${ARCH}
          EOF

          cat > preferences <<EOF
          Package: *
          Pin: release o=Kurokesu-libcamera-pin
          Pin-Priority: 1001
          EOF

          # Defense-in-depth. Pin-Priority is the mechanism we trust. The
          # assert below verifies it actually fired. dpkg records the
          # unmodified version (with ~), so bookworm expects the tilde.
          case "${SUITE}" in
            bookworm) EXPECTED="${PINNED_VERSION}~bpo12+1" ;;
            *)        EXPECTED="${PINNED_VERSION}" ;;
          esac
          printf '%s\n' "${EXPECTED}" > expected-version

          cat > assert-libcamera-version.sh <<'SH'
          #!/bin/sh
          set -eu
          PIN_DIR=$(dirname "$0")
          EXPECTED=$(cat "${PIN_DIR}/expected-version")
          INSTALLED=$(dpkg-query -W -f '${Version}' libcamera-dev 2>/dev/null || echo NOT_INSTALLED)
          if [ "$INSTALLED" != "$EXPECTED" ]; then
            printf '::error::libcamera-dev version mismatch: installed=%s pin expects=%s\n' \
              "$INSTALLED" "$EXPECTED" >&2
            exit 1
          fi
          printf 'libcamera-dev version check OK: %s\n' "$INSTALLED"
          SH
          chmod +x assert-libcamera-version.sh

      - name: Generate orig tarball from upstream ref
        working-directory: upstream
        run: |
          set -euo pipefail
          PKG="${{ inputs.package-name }}"
          UPSTREAM="${{ steps.version.outputs.upstream }}"
          # gen-version.sh picks this up so the runtime version banner
          # reports the full version instead of the bare project version.
          echo "${UPSTREAM}" > .tarball-version
          git archive --format=tar \
            --prefix="${PKG}-${UPSTREAM}/" \
            --add-file=.tarball-version \
            HEAD \
            | xz -T0 > "${GITHUB_WORKSPACE}/${PKG}_${UPSTREAM}.orig.tar.xz"
          ls -la "${GITHUB_WORKSPACE}/${PKG}_${UPSTREAM}.orig.tar.xz"

      - name: Stage source tree (orig + debian/)
        run: |
          set -euo pipefail
          PKG="${{ inputs.package-name }}"
          UPSTREAM="${{ steps.version.outputs.upstream }}"
          cd "${GITHUB_WORKSPACE}"
          tar xf "${PKG}_${UPSTREAM}.orig.tar.xz"
          cp -r recipe/debian "${PKG}-${UPSTREAM}/"

      - name: Build with sbuild
        run: |
          set -euo pipefail
          PKG="${{ inputs.package-name }}"
          UPSTREAM="${{ steps.version.outputs.upstream }}"
          SUFFIX="${{ inputs.version-suffix }}"
          cd "${GITHUB_WORKSPACE}/${PKG}-${UPSTREAM}"
          # sbuild requires an attribution because appending a
          # suffix edits the changelog copy.
          MAINT=$(dpkg-parsechangelog -SMaintainer)
          # Layer in the local libcamera pin repo. Preferences install
          # before dep resolution, the assert runs after.
          LIBCAMERA_PIN_DIR="${GITHUB_WORKSPACE}/libcamera-pin"
          sbuild \
            -d "${{ inputs.suite }}" \
            --arch=${{ inputs.arch }} \
            --profiles="${{ inputs.profiles }}" \
            ${SUFFIX:+--append-to-version="${SUFFIX}" --maintainer="${MAINT}"} \
            --extra-repository="deb [trusted=yes] file://${LIBCAMERA_PIN_DIR} ${{ inputs.suite }} main" \
            --chroot-setup-commands="install -m644 ${LIBCAMERA_PIN_DIR}/preferences /etc/apt/preferences.d/kurokesu-libcamera" \
            --starting-build-commands="${LIBCAMERA_PIN_DIR}/assert-libcamera-version.sh" \
            --extra-repository="deb http://archive.raspberrypi.com/debian/ ${{ inputs.suite }} main" \
            --extra-repository-key="${GITHUB_WORKSPACE}/recipe/.github/keys/raspberrypi-archive-keyring.gpg" \
            --no-clean-source

      - name: Sanitize sbuild log filename
        # sbuild's timestamped log name contains colons, which
        # actions/upload-artifact rejects. Keep the log under its
        # stable colon-free symlink name.
        if: always() && steps.version.outcome == 'success'
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}"
          for f in *.build; do
            if [ -L "$f" ]; then
              target=$(readlink "$f")
              rm "$f"
              mv "$target" "$f"
            fi
          done

      - name: Upload .deb set + build metadata
        # Run even on build failure so the .build log is preserved.
        if: always() && steps.version.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # sbuild drops every output in the parent of the source tree,
          # which here is ${{ github.workspace }}.
          name: ${{ inputs.package-name }}_${{ steps.version.outputs.packaging-fname }}_${{ inputs.suite }}_${{ inputs.arch }}
          path: |
            ${{ github.workspace }}/*.deb
            ${{ github.workspace }}/*.changes
            ${{ github.workspace }}/*.buildinfo
            ${{ github.workspace }}/*.build
            ${{ github.workspace }}/*.dsc
            ${{ github.workspace }}/*.debian.tar.*
            ${{ github.workspace }}/*.orig.tar.*
          if-no-files-found: warn
          retention-days: 30
